[project]
name = "secret-of-evermore-re"
version = "0.1.0"
description = "Reverse-engineering notes and ROM extraction tools for Secret of Evermore (SNES)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
viewer = ["pygame>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soe", "viewer"]
